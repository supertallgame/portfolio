name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [CoreEconomy, HomeHub, ChestShops]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find ${{ matrix.plugin }}
        id: find
        run: |
          POM=$(find . -path "*/${{ matrix.plugin }}/pom.xml" | head -n 1)
          if [ -z "$POM" ]; then
            echo "Could not find ${{ matrix.plugin }}/pom.xml in the repo"
            find . -name pom.xml
            exit 1
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.plugin }}
        run: mvn -B clean package --file ${{ steps.find.outputs.pom }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: ${{ steps.find.outputs.dir }}/target/*.jar
