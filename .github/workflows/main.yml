name: Build plugins

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [CoreEconomy, HomeHub, ChestShops]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find ${{ matrix.plugin }}
        id: find
        run: |
          POM=$(find . -path "*/${{ matrix.plugin }}/pom.xml" | head -n 1)
          if [ -z "$POM" ]; then
            echo "Could not find ${{ matrix.plugin }}/pom.xml in the repo"
            find . -name pom.xml
            exit 1
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.plugin }}
        run: mvn -B clean package --file ${{ steps.find.outputs.pom }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: ${{ steps.find.outputs.dir }}/target/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Publish release with the jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l jars
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest jars/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Plugin jars built from commit $GITHUB_SHA"
