name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [CoreEconomy, HomeHub, ChestShops]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ${{ matrix.plugin }}
        run: mvn -B clean package --file ${{ matrix.plugin }}/pom.xml

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: ${{ matrix.plugin }}/target/*.jar
