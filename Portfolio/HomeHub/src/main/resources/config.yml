# HomeHub configuration
prefix: "<aqua>[HomeHub]</aqua> <gray>"

# Seconds a player must stand still before teleporting (0 = instant)
warmup-seconds: 3
# Seconds between teleports
cooldown-seconds: 10

# Players get this many homes unless a permission gives them more.
# Grant ranks higher limits with permission nodes:  homes.limit.5, homes.limit.10, ...
# The highest matching node wins. homes.limit.unlimited removes the cap.
default-home-limit: 2
