# DailyQuests configuration
prefix: "<light_purple>[Quests]</light_purple> <gray>"

# How many quests each player gets per day (1-4)
daily-quest-count: 3

# Quest types: BREAK_BLOCK, KILL_MOB
# target: a Material name (BREAK_BLOCK), an EntityType name (KILL_MOB), or ANY
# reward commands run from the console. %player% is replaced with the player's name.
# (The example rewards use /eco from the CoreEconomy plugin - swap in any command you like.)
quests:
  stone_miner:
    name: "Stone Miner"
    type: BREAK_BLOCK
    target: STONE
    amount: 100
    reward-text: "$250"
    reward-commands:
      - "eco give %player% 250"
  deep_digger:
    name: "Deep Digger"
    type: BREAK_BLOCK
    target: DEEPSLATE
    amount: 64
    reward-text: "$300 + 3 Diamonds"
    reward-commands:
      - "eco give %player% 300"
      - "give %player% diamond 3"
  lumberjack:
    name: "Lumberjack"
    type: BREAK_BLOCK
    target: OAK_LOG
    amount: 50
    reward-text: "$150"
    reward-commands:
      - "eco give %player% 150"
  zombie_slayer:
    name: "Zombie Slayer"
    type: KILL_MOB
    target: ZOMBIE
    amount: 20
    reward-text: "$200"
    reward-commands:
      - "eco give %player% 200"
  skeleton_hunter:
    name: "Skeleton Hunter"
    type: KILL_MOB
    target: SKELETON
    amount: 15
    reward-text: "$200 + 16 Arrows"
    reward-commands:
      - "eco give %player% 200"
      - "give %player% arrow 16"
  monster_masher:
    name: "Monster Masher"
    type: KILL_MOB
    target: ANY
    amount: 40
    reward-text: "$400"
    reward-commands:
      - "eco give %player% 400"
