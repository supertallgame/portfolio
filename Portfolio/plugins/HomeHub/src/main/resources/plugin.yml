name: HomeHub
version: '${project.version}'
main: dev.portfolio.homehub.HomeHubPlugin
api-version: '1.21'
author: YourName
description: Homes and warps with cooldowns, warmups and rank-based limits.

commands:
  sethome:
    description: Set a home at your location
    usage: /sethome [name]
  home:
    description: Teleport to a home
    usage: /home [name]
  delhome:
    description: Delete a home
    usage: /delhome <name>
  homes:
    description: List your homes
    usage: /homes
  setwarp:
    description: Create a server warp
    usage: /setwarp <name>
  delwarp:
    description: Delete a server warp
    usage: /delwarp <name>
  warp:
    description: Teleport to a warp
    usage: /warp <name>
  warps:
    description: List all warps
    usage: /warps

permissions:
  homehub.use:
    description: Use homes and warps
    default: true
  homes.limit.unlimited:
    description: No home limit
    default: op
  homehub.admin:
    description: Create and delete warps
    default: op
  homehub.bypass:
    description: Skip cooldown and warmup
    default: op
